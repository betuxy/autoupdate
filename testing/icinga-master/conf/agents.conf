// Endpoint and Zone objects for the test agents.
// Agents initiate the connection to the master; no `host` attribute here.
// The master's zone is named "master" (image's generated zones.conf);
// its Endpoint is named "icinga-master".

object Endpoint "agent1" { }
object Zone "agent1" {
    parent    = "master"
    endpoints = ["agent1"]
}

object Endpoint "agent2" { }
object Zone "agent2" {
    parent    = "master"
    endpoints = ["agent2"]
}
