// Host template: TCP check on SSH port (ICMP ping is unreliable in rootless Podman).
template Host "test-host" {
    check_command      = "tcp"
    vars.tcp_port      = 22
    max_check_attempts = 3
    check_interval     = 1m
    retry_interval     = 30s
}

// Service template for checks executed on the agent via command_endpoint.
template Service "agent-service" {
    max_check_attempts = 3
    check_interval     = 5m
    retry_interval     = 1m
}

// ── agent1 ────────────────────────────────────────────────────────────────────

object Host "agent1" {
    import        "test-host"
    address       = "agent1"
    display_name  = "Test Agent 1"
}

object Service "apt" {
    import            "agent-service"
    host_name         = "agent1"
    display_name      = "apt"
    check_command     = "apt"
    command_endpoint  = "agent1"
    zone              = "master"
}

object Service "needrestart" {
    import            "agent-service"
    host_name         = "agent1"
    display_name      = "needrestart"
    check_command     = "needrestart"
    command_endpoint  = "agent1"
    zone              = "master"
}

// ── agent2 ────────────────────────────────────────────────────────────────────

object Host "agent2" {
    import        "test-host"
    address       = "agent2"
    display_name  = "Test Agent 2"
}

object Service "apt" {
    import            "agent-service"
    host_name         = "agent2"
    display_name      = "apt"
    check_command     = "apt"
    command_endpoint  = "agent2"
    zone              = "master"
}

object Service "needrestart" {
    import            "agent-service"
    host_name         = "agent2"
    display_name      = "needrestart"
    check_command     = "needrestart"
    command_endpoint  = "agent2"
    zone              = "master"
}
