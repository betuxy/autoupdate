// Check command for passive services: runs /bin/true so active rechecks (force_check) succeed.
// State is normally set via process-check-result from the simulate-critical playbook.
object CheckCommand "always-ok" {
    command = ["/bin/echo", "-n", "OK - state managed via process-check-result"]
}

template Host "test-host" {
    check_command = "hostalive"
    max_check_attempts = 3
    check_interval = 1m
    retry_interval = 30s
}

// Passive-only services: no automatic active checks.
// force_check via reschedule-check (in 06-check-recovery.yml) runs always-ok → clears CRITICAL.
template Service "passive-service" {
    check_command = "always-ok"
    enable_active_checks = false
    enable_passive_checks = true
    max_check_attempts = 1
    check_interval = 24h
    retry_interval = 5m
}

object Host "agent1" {
    import "test-host"
    address = "agent1"
    display_name = "Test Agent 1"
}

object Service "apt" {
    import "passive-service"
    host_name = "agent1"
    display_name = "apt"
}

object Service "needrestart" {
    import "passive-service"
    host_name = "agent1"
    display_name = "needrestart"
}

object Host "agent2" {
    import "test-host"
    address = "agent2"
    display_name = "Test Agent 2"
}

object Service "apt" {
    import "passive-service"
    host_name = "agent2"
    display_name = "apt"
}

object Service "needrestart" {
    import "passive-service"
    host_name = "agent2"
    display_name = "needrestart"
}
