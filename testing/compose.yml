---
services:
  icinga-master:
    image: icinga/icinga2
    container_name: autoupdate_icinga-master
    hostname: icinga-master
    ports:
      - "5665:5665"
    environment:
      ICINGA_MASTER: "1"
    volumes:
      - icinga-master-data:/data
      - ./icinga-master/conf/autoupdate-user.conf:/data/etc/icinga2/conf.d/autoupdate-user.conf:ro
      - ./icinga-master/conf/icingaweb2-api-user.conf:/data/etc/icinga2/conf.d/icingaweb2-api-user.conf:ro
      - ./icinga-master/conf/hosts.conf:/data/etc/icinga2/conf.d/hosts.conf:ro
      - ./icinga-master/conf/icingadb.conf:/data/etc/icinga2/conf.d/icingadb.conf:ro
    networks:
      - icinga-test
    healthcheck:
      test:
        - CMD
        - curl
        - -sk
        - -u
        - "autoupdate:Pain-Frequently-Mother-Sun3-Instead"
        - "https://localhost:5665/v1/status"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: autoupdate_redis
    networks:
      - icinga-test

  mariadb:
    image: mariadb:10.11
    container_name: autoupdate_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: icinga
      MYSQL_DATABASE: icingadb
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
    networks:
      - icinga-test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-picinga"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  icingadb:
    image: icinga/icingadb
    container_name: autoupdate_icingadb
    environment:
      ICINGADB_REDIS_HOST: redis
      ICINGADB_REDIS_PORT: "6379"
      ICINGADB_DATABASE_HOST: mariadb
      ICINGADB_DATABASE_PORT: "3306"
      ICINGADB_DATABASE_DATABASE: icingadb
      ICINGADB_DATABASE_USER: icingadb
      ICINGADB_DATABASE_PASSWORD: icingadb
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - icinga-test

  icingaweb2:
    image: icinga/icingaweb2
    container_name: autoupdate_icingaweb2
    ports:
      - "8080:8080"
    environment:
      icingaweb.enabledModules: icingadb
      icingaweb.config.global.config_backend: db
      icingaweb.config.global.config_resource: icingaweb_db
      icingaweb.config.logging.log: php
      icingaweb.authentication.icingaweb2.backend: db
      icingaweb.authentication.icingaweb2.resource: icingaweb_db
      icingaweb.passwords.icingaweb2.icingaadmin: icinga
      icingaweb.roles.Administrators.users: icingaadmin
      icingaweb.roles.Administrators.permissions: "*"
      icingaweb.groups.icingaweb2.backend: db
      icingaweb.groups.icingaweb2.resource: icingaweb_db
      icingaweb.resources.icingaweb_db.type: db
      icingaweb.resources.icingaweb_db.db: mysql
      icingaweb.resources.icingaweb_db.host: mariadb
      icingaweb.resources.icingaweb_db.dbname: icingaweb
      icingaweb.resources.icingaweb_db.username: icingaweb
      icingaweb.resources.icingaweb_db.password: icingaweb
      icingaweb.resources.icingaweb_db.charset: utf8mb4
      icingaweb.resources.icingadb.type: db
      icingaweb.resources.icingadb.db: mysql
      icingaweb.resources.icingadb.host: mariadb
      icingaweb.resources.icingadb.dbname: icingadb
      icingaweb.resources.icingadb.username: icingadb
      icingaweb.resources.icingadb.password: icingadb
      icingaweb.resources.icingadb.charset: utf8mb4
      icingaweb.modules.icingadb.config.icingadb.resource: icingadb
      icingaweb.modules.icingadb.redis.redis1.host: redis
      icingaweb.modules.icingadb.redis.redis1.port: "6379"
      icingaweb.modules.icingadb.commandtransports.icinga2.transport: api
      icingaweb.modules.icingadb.commandtransports.icinga2.host: icinga-master
      icingaweb.modules.icingadb.commandtransports.icinga2.port: "5665"
      icingaweb.modules.icingadb.commandtransports.icinga2.username: icingaweb
      icingaweb.modules.icingadb.commandtransports.icinga2.password: icingaweb
    volumes:
      - icingaweb2-data:/data
    depends_on:
      mariadb:
        condition: service_healthy
      icinga-master:
        condition: service_healthy
    networks:
      - icinga-test

  agent1:
    build: ./icinga-agent
    container_name: autoupdate_agent1
    hostname: agent1
    ports:
      - "2222:22"
    networks:
      - icinga-test
    restart: always
    volumes:
      - ./keys/ansible_ed25519.pub:/tmp/ansible_key.pub:ro

  agent2:
    build: ./icinga-agent
    container_name: autoupdate_agent2
    hostname: agent2
    ports:
      - "2223:22"
    networks:
      - icinga-test
    restart: always
    volumes:
      - ./keys/ansible_ed25519.pub:/tmp/ansible_key.pub:ro

volumes:
  icinga-master-data:
  mariadb-data:
  icingaweb2-data:

networks:
  icinga-test:
    driver: bridge
